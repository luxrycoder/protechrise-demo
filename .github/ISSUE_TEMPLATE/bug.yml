name: Bug
description: Something is broken or behaves differently from the legacy site
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what you saw. Add URLs and screenshots.
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Where
      options: ["Local", "dev.protechrise.com", "Other"]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Browser and device, suspected cause, links to the legacy behaviour. Do not paste secrets, tokens or personal data.
