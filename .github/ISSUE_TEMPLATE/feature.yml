name: Feature
description: A user-facing feature or page to build
labels: []
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem or need. Who benefits?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in (and what is deliberately out).
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. The PR is done when all are true.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: legacy
    attributes:
      label: Legacy reference
      description: Files or endpoints in OctoberCoder/tech-rise-academy to port from, if any.
  - type: textarea
    id: deps
    attributes:
      label: Depends on
      description: Issue numbers that must be done first.
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["S (about a day)", "M (2-3 days)", "L (about a week)", "XL (split it first)"]
    validations:
      required: true
